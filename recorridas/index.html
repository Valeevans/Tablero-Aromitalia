<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aromitalia · Recorridas de Planta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#1f2f53; --navy-2:#2c3f6b; --navy-soft:#e8ecf4;
  --bg:#f6f6f3; --surface:#ffffff; --line:#e3e2dc; --line-2:#cfcdc5;
  --ink:#16181d; --ink-2:#52514e; --ink-3:#86857f;
  --ok:#0b7a3b; --ok-bg:#e5f4ea; --warn:#a46200; --warn-bg:#fdf1dc; --bad:#b42424; --bad-bg:#fbe6e4;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-in{max-width:1180px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.top-in img{height:34px;width:auto;display:block}
.brand-sub{font-size:12px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;border-left:1px solid var(--line);padding-left:14px}
nav.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.tabs button{border:0;background:transparent;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-weight:500}
nav.tabs button:hover{background:var(--navy-soft);color:var(--navy)}
nav.tabs button.on{background:var(--navy);color:#fff}
main{max-width:1180px;margin:0 auto;padding:20px 18px 80px}
h1{font-size:22px;margin:0 0 4px;color:var(--navy);letter-spacing:-.01em}
h2{font-size:16px;margin:0 0 12px;color:var(--navy)}
h3{font-size:14px;margin:0 0 8px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}
.muted{color:var(--ink-3)} .small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;min-width:150px;flex:1}
.field label{font-size:12px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em}
input[type=text],input[type=date],input[type=month],input[type=number],select,textarea{border:1px solid var(--line-2);background:#fff;border-radius:8px;padding:9px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--navy-2);outline-offset:0;border-color:var(--navy-2)}
.btn{border:1px solid var(--line-2);background:#fff;border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--navy);color:var(--navy)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}
.btn.danger{color:var(--bad)} .btn.danger:hover{border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:14px}
.banner{padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:14px}
.banner.warn{background:var(--warn-bg);color:#6b4100}
.banner.info{background:var(--navy-soft);color:var(--navy)}
/* scoring */
.cat{border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;background:#fff;overflow:hidden}
.cat-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--navy-soft);font-weight:700;color:var(--navy)}
.cat-h .pct{font-variant-numeric:tabular-nums;font-size:14px}
.item{display:grid;grid-template-columns:1fr auto;gap:8px 14px;padding:10px 14px;border-top:1px solid var(--line);align-items:center}
.item .lab{font-weight:500}
.item .crit{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.seg{display:flex;gap:4px}
.seg button{min-width:44px;height:40px;border:1px solid var(--line-2);background:#fff;border-radius:8px;cursor:pointer;font-weight:700;font-variant-numeric:tabular-nums}
.seg button[data-v="0"].on{background:var(--bad);border-color:var(--bad);color:#fff}
.seg button[data-v="3"].on{background:#d9822b;border-color:#d9822b;color:#fff}
.seg button[data-v="6"].on{background:#c9a400;border-color:#c9a400;color:#fff}
.seg button[data-v="9"].on{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button[data-v="ne"]{font-weight:500;font-size:12px;min-width:52px;color:var(--ink-3)}
.seg button[data-v="ne"].on{background:var(--ink-3);color:#fff;border-color:var(--ink-3)}
.add-dev{font-size:12px;border:0;background:none;color:var(--navy-2);cursor:pointer;padding:0;margin-top:4px;text-decoration:underline}
@media (max-width:640px){.item{grid-template-columns:1fr}.seg button{flex:1}}
/* allergen checklist */
.al-row{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:9px 14px;border-top:1px solid var(--line);align-items:center}
.al-row .seg button{min-width:58px;height:34px;font-size:12px;font-weight:600}
.al-row .seg button.on[data-a="C"]{background:var(--ok);border-color:var(--ok);color:#fff}
.al-row .seg button.on[data-a="NC"]{background:var(--bad);border-color:var(--bad);color:#fff}
.al-row .seg button.on[data-a="NA"]{background:var(--ink-3);border-color:var(--ink-3);color:#fff}
.al-row input{grid-column:1/-1;font-size:13px;padding:6px 8px}
@media (max-width:640px){.al-row{grid-template-columns:1fr}}
.dev-row{display:grid;grid-template-columns:170px 1fr auto;gap:8px;margin-bottom:8px}
@media (max-width:640px){.dev-row{grid-template-columns:1fr}}
.sticky-save{position:sticky;bottom:0;background:rgba(246,246,243,.96);backdrop-filter:blur(4px);border-top:1px solid var(--line);padding:12px 0;margin-top:10px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;z-index:5}
.score-big{font-size:26px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
/* tables */
.tbl-wrap{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
table.t th,table.t td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);background:#fafaf8;white-space:nowrap}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.tot td{font-weight:700;border-top:2px solid var(--line-2);color:var(--navy)}
td.low{background:var(--bad-bg);color:var(--bad);font-weight:600}
td.mid{background:var(--warn-bg);color:#7a4a00}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--navy-soft);color:var(--navy)}
.pill.imp{background:#f0efe9;color:var(--ink-3)}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .k{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kpi .v{font-size:28px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .d{font-size:13px;color:var(--ink-2)}
.chart-box{position:relative;height:340px}
.legend-note{font-size:12px;color:var(--ink-3);margin-top:8px}
ul.list{margin:0;padding-left:18px} ul.list li{margin-bottom:6px}
.empty{padding:30px;text-align:center;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
/* modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(15,20,35,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:12px;max-width:440px;width:100%;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal p{margin:0 0 16px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;z-index:60;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.err{background:var(--bad)}
.hidden{display:none!important}
.pill.st-open{background:#fbe6e4;color:#b42424}.pill.st-an{background:#fdf1dc;color:#7a4a00}.pill.st-tr{background:#e8ecf4;color:#1f2f53}.pill.st-re{background:#b42424;color:#fff}.pill.st-ok{background:#e5f4ea;color:#0b7a3b}.pill.st-venc{background:#fff;color:#b42424;border:1px solid #b42424}
.acc-row{display:grid;grid-template-columns:2fr 1fr 150px 130px auto;gap:8px;margin-bottom:8px}
@media (max-width:760px){.acc-row{grid-template-columns:1fr 1fr}}
</style>
</head>

// Puntaje de una categoría en una recorrida: suma / (ítems evaluados × 9)
function catScore(scores,n){ const v=ITEMS.filter(i=>i.cat===n).map(i=>scores[i.cod]).filter(x=>typeof x==="number"); return v.length? v.reduce((a,b)=>a+b,0)/(v.length*9):null; }
function genScore(scores){ const v=ITEMS.map(i=>scores[i.cod]).filter(x=>typeof x==="number"); return v.length? v.reduce((a,b)=>a+b,0)/(v.length*9):null; }
// Agregado de varias recorridas (igual que la columna TOTAL de la planilla: promedio por ítem y luego % de la categoría)
function aggregate(recs){
  if(!recs.length) return null;
  const avg={};
  ITEMS.forEach(i=>{const v=recs.map(r=>r.scores?.[i.cod]).filter(x=>typeof x==="number"); if(v.length) avg[i.cod]=v.reduce((a,b)=>a+b,0)/v.length;});
  return {items:avg, cats:CATS.map(c=>catScore(avg,c.n)), gen:genScore(avg), n:recs.length};
}
const recMonth = r=>r.fecha?.slice(0,7);
const recsOf = (sector,ym)=>S.recs.filter(r=>(!sector||r.sector===sector)&&(!ym||recMonth(r)===ym)).sort((a,b)=>(a.fecha+a.turno).localeCompare(b.fecha+b.turno));
const ym = (y,m)=>`${y}-${String(m).padStart(2,"0")}`;
function sectorYear(sector,y){ return MESES.map((_,i)=>aggregate(recsOf(sector,ym(y,i+1)))); }
// Global: promedio de los sectores que tuvieron recorridas en el mes
function globalMonth(y,m){
  const per=SECTORES.map(s=>aggregate(recsOf(s.id,ym(y,m)))).filter(Boolean);
  if(!per.length) return null;
  const mean=a=>{const v=a.filter(x=>x!=null);return v.length?v.reduce((p,q)=>p+q,0)/v.length:null;};
  return {cats:CATS.map((c,k)=>mean(per.map(p=>p.cats[k]))), gen:mean(per.map(p=>p.gen)), nSect:per.length};
}
// 8.a sugerido a partir del checklist (solapa ALÉRGENOS)
function alergenosSugerido(al){
  const v=Object.values(al||{}).map(x=>x.r).filter(r=>r==="C"||r==="NC");
  if(!v.length) return null;
  const p=v.filter(r=>r==="C").length/v.length;
  return p===1?9: p>=0.6?6: p>0?3:0;
}

function syncMsg(msg,col){ const e=document.getElementById("sync"); if(e){ e.textContent=msg; e.style.color=col||"var(--ink-3)"; } }
function cacheSave(){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify({recs:S.recs,trat:S.trat})); }catch(e){} }
function applyRows(rows){
  const recs=[], trat={}; let seedVer="";
  rows.forEach(r=>{ const k=String(r[0]||""); let v; try{ v=typeof r[1]==="string"?JSON.parse(r[1]):r[1]; }catch(e){ return; }
    if(k.startsWith("rec:")) recs.push({...v,id:k.slice(4)}); else if(k.startsWith("trat:")) trat[k.slice(5)]=v; else if(k==="meta:seed") seedVer=v; });
  S.recs=recs; S.trat=trat; return seedVer;
}
function initDefaults(){
  if(!S._init && S.recs.length){ S._init=true; const last=S.recs.map(recMonth).filter(Boolean).sort().pop();
    if(!S.recs.some(r=>recMonth(r)===S.f.mes)) S.f.mes=last; S.f.anio=+last.slice(0,4); S.f.d.anio=S.f.anio; }
}
async function initData(silent){
  S.canWrite = true;
  if(!API_URL || API_URL.indexOf("script.google.com")<0){
    S.db=false; S.loaded=true; S.loadErr="Falta configurar la conexión con la planilla de Google (API_URL). Hasta entonces la app no puede guardar ni leer recorridas.";
    render(); syncMsg("⚠ Sin conexión configurada","var(--bad)"); return;
  }
  S.db=true;
  if(!silent) syncMsg("⏳ Cargando…","var(--warn)");
  try{
    const res=await fetch(API_URL+(API_URL.includes("?")?"&":"?")+"t="+Date.now());
    const rows=await res.json(); if(!Array.isArray(rows)) throw new Error("respuesta inesperada");
    const seedVer=applyRows(rows); cacheSave(); S.loadErr=null; initDefaults();
    syncMsg("✓ Sincronizado","var(--ok)"); S.loaded=true; render(true);
    if(seedVer!==SEED_VER) sembrar();
  }catch(e){
    console.error(e);
    try{ const c=JSON.parse(localStorage.getItem(CACHE_KEY)||"null"); if(c){ S.recs=c.recs||[]; S.trat=c.trat||{}; initDefaults(); } }catch(e2){}
    S.loaded=true; if(!silent) S.loadErr="No se pudo leer la planilla de Google. Se muestran los últimos datos guardados en este equipo.";
    syncMsg("⚠ Sin conexión con la planilla","var(--warn)"); render(true);
  }
}
// Carga única del historial 2026 de la planilla Excel (si ya existe un registro con ese id, no lo pisa)
async function sembrar(){
  const ids=new Set(S.recs.map(r=>r.id)); const nuevos=SEED.filter(r=>!ids.has(r.id));
  nuevos.forEach(({id,...d})=>S.recs.push({...d,id})); render(true);
  syncMsg(`⏳ Cargando historial en la planilla (${nuevos.length} recorridas)…`,"var(--warn)");
  const items=nuevos.map(({id,...d})=>({key:"rec:"+id,value:d})); items.push({key:"meta:seed",value:SEED_VER});
  await fetch(API_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action:"bulk",items})}).catch(()=>{}); cacheSave(); initDefaults(); syncMsg("✓ Sincronizado","var(--ok)"); render(true);
}
function apiPut(key,value,quiet){
  return fetch(API_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({key,value})})
    .then(()=>{ if(!quiet) syncMsg("✓ Guardado en la planilla","var(--ok)"); })
    .catch(e=>{ syncMsg("⚠ No se pudo guardar en la planilla","var(--bad)"); throw {code:"unavailable"}; });
}
function apiDel(key){
  return fetch(API_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action:"delete",key})})
    .then(()=>syncMsg("✓ Eliminado","var(--ok)")).catch(e=>{ syncMsg("⚠ No se pudo eliminar","var(--bad)"); throw {code:"unavailable"}; });
}
async function saveRec(rec){
  if(!S.db) throw {code:"unavailable"};
  const id = rec.id || ("r-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7));
  const data = {...rec}; delete data.id;
  data.actualizado = new Date().toISOString();
  if(!data.creado) data.creado = data.actualizado;
  await apiPut("rec:"+id,data);
  const i=S.recs.findIndex(r=>r.id===id); if(i>=0) S.recs[i]={...data,id}; else S.recs.push({...data,id}); cacheSave();
  return id;
}
async function deleteRec(id){ await apiDel("rec:"+id); S.recs=S.recs.filter(r=>r.id!==id); cacheSave(); render(); }
async function saveTrat(key,data){ await apiPut("trat:"+key,data); S.trat[key]=data; cacheSave(); }

async function saveFile(filename, data){
  try{
    const blob = data instanceof Blob ? data : new Blob([data]);
    const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
  }catch(e){ toast("No se pudo descargar el archivo.",true); }
}

function render(fromData){
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===S.view));

  if(fromData && ((S.view==="nueva" && S.draft) || (S.view==="desvios" && S.dEdit))) return;
  const app=$("#app");
  let banner="";
  if(S.loadErr) banner=`<div class="banner warn">${esc(S.loadErr)}</div>`;
  else if(false) banner=`<div class="banner warn">Tenés acceso de solo lectura: podés ver y descargar reportes, pero no cargar recorridas.</div>`;
  if(!S.loaded){ app.innerHTML=`<div class="empty">Cargando recorridas…</div>`; return; }
  const v=S.view;
  if(v==="nueva") return renderForm(app,banner);
  if(v==="historial") return renderHist(app,banner);
  if(v==="desvios") return renderDesvios(app,banner);
  if(v==="mensual") return renderMensual(app,banner);
  if(v==="anual") return renderAnual(app,banner);
  if(v==="global") return renderGlobal(app,banner);
}

  $("#cats").addEventListener("click",e=>{
    const b=e.target.closest(".seg[data-item] button");

    const a=e.target.closest(".al-row .seg button");

      a.parentElement.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===a));

      updateTotals(); return;}

  });
  $("#cats").addEventListener("input",e=>{const i=e.target.closest("input[data-alobs]"); if(i){const k=i.dataset.alobs; d.alergenos[k]=Object.assign(d.alergenos[k]||{},{obs:i.value});}});
  $("#add-dev").onclick=()=>{d.desvios.push({item:"",texto:""}); renderDevs(true);};
  $("#clear").onclick=()=>modal("<p>¿Borrar todo lo cargado en este formulario?</p>",[{label:"Cancelar"},{label:"Limpiar",cls:"danger",fn:()=>{S.draft=newDraft();S.editingId=null;render();}}]);
  if($("#cancel-edit")) $("#cancel-edit").onclick=()=>{S.draft=null;S.editingId=null;go("historial");};

}
function alergenosBlock(list,d,sug){
  if(!list) return `<div class="al-row"><div class="muted small">Elegí el sector para ver el checklist de alérgenos.</div></div>`;
  const c=Object.values(d.alergenos).filter(x=>x.r==="C").length, nc=Object.values(d.alergenos).filter(x=>x.r==="NC").length;
  return `<div class="al-row" style="background:#fafaf8"><div class="small"><b>Checklist de alérgenos del sector</b> — completá para obtener el puntaje sugerido de 8.a (100% → 9 · 60–99% → 6 · &lt;60% → 3 · ninguno → 0)</div><div class="small">8.a sugerido: <b id="al-sug">${sug==null?"—":sug}</b></div></div>
  ${list.map((t,k)=>{const r=(d.alergenos[k]||{}).r, o=(d.alergenos[k]||{}).obs||"";return `<div class="al-row"><div class="small">${k+1}. ${esc(t)}</div>
    <div class="seg" data-al="${k}">${[["C","Cumple"],["NC","No cumple"],["NA","N/A"]].map(([a,l])=>`<button data-a="${a}" class="${r===a?"on":""}">${l}</button>`).join("")}</div>
    <input type="text" data-alobs="${k}" value="${esc(o)}" placeholder="Observaciones (opcional)"></div>`;}).join("")}`;
}
function renderDevs(focusLast){
  const d=S.draft, box=$("#devs");
  if(!d.desvios.length){box.innerHTML=`<p class="muted small" style="margin-top:0">Sin desvíos registrados.</p>`;return;}
  box.innerHTML=d.desvios.map((x,k)=>`<div class="dev-row"><select data-k="${k}" data-f="item"><option value="">General</option>${ITEMS.map(i=>`<option value="${i.cod}" ${x.item===i.cod?"selected":""}>${i.cod} ${esc(i.nombre)}</option>`).join("")}</select>
    <input type="text" data-k="${k}" data-f="texto" value="${esc(x.texto)}" placeholder="Describí el desvío observado"><button class="btn sm danger" data-del="${k}">Quitar</button></div>`).join("");
  box.oninput=box.onchange=e=>{const t=e.target; if(t.dataset.k!=null) d.desvios[+t.dataset.k][t.dataset.f]=t.value;};
  box.onclick=e=>{const b=e.target.closest("[data-del]"); if(b){d.desvios.splice(+b.dataset.del,1); renderDevs();}};
  if(focusLast){ const ins=box.querySelectorAll('input[data-f="texto"]'); ins[ins.length-1]?.focus(); }
}
function updateTotals(){
  const d=S.draft; CATS.forEach(c=>{const el=$(`[data-cat="${c.n}"]`); if(el) el.textContent=pct(catScore(d.scores,c.n));});
  $("#gen").textContent=pct(genScore(d.scores));
  $("#evalc").textContent=`· ${Object.keys(d.scores).length}/${ITEMS.length} ítems evaluados`;
}
async function onSave(){
  const d=S.draft;
  if(!d.fecha||!d.sector||!d.responsable.trim()){ toast("Completá fecha, sector y responsable.",true); return; }
  if(!Object.keys(d.scores).length){ toast("Evaluá al menos un ítem.",true); return; }
  d.desvios=d.desvios.filter(x=>x.texto.trim()).map(x=>({...x,id:x.id||("d"+Date.now().toString(36)+Math.random().toString(36).slice(2,6))}));
  const btn=$("#save"); btn.disabled=true; btn.textContent="Guardando…";
  try{
    const id=await saveRec({...d,id:S.editingId||undefined});
    toast("Recorrida guardada ✓");
    const savedId=id; S.draft=null; S.editingId=null;
    modal(`<p><b>Recorrida guardada.</b><br><span class="muted small">${esc(secName(d.sector))} · ${fdate(d.fecha)} · Puntaje general ${pct(genScore(d.scores))}</span></p>`,
      [{label:"Cargar otra",fn:()=>go("nueva")},{label:"Descargar registro PDF",cls:"primary",fn:()=>{pdfRecorrida({...d,id:savedId}); go("historial");}}]);
    render();
  }catch(e){ btn.disabled=false; btn.textContent="Guardar recorrida";
    toast("No se pudo guardar en la planilla. Revisá la conexión y probá de nuevo.",true); }
}

function sectorSelect(id,val){return `<select id="${id}">${SECTORES.map(s=>`<option value="${s.id}" ${val===s.id?"selected":""}>${esc(s.nombre)}</option>`).join("")}</select>`;}
function yearOptions(sel){const ys=new Set(S.recs.map(r=>+(r.fecha||"").slice(0,4)).filter(Boolean));ys.add(+today().slice(0,4));return [...ys].sort().map(y=>`<option ${y===sel?"selected":""}>${y}</option>`).join("");}
function renderMensual(app,banner){

   <div class="row"><button class="btn" id="m-xls" ${ag?"":"disabled"}>⬇ Excel</button><button class="btn primary" id="m-pdf" ${ag?"":"disabled"}>⬇ PDF</button></div></div>
  <div class="card"><div class="row"><div class="field" style="flex:2">${'<label>Sector</label>'+sectorSelect("m-sec",sec)}</div><div class="field"><label>Mes</label><input type="month" id="m-mes" value="${m}"></div></div></div>
  ${!ag?`<div class="card empty">No hay recorridas de ${esc(secName(sec))} en ${MESES[mm-1]} ${y}.</div>`:`
  <div class="kpis">
    <div class="kpi"><div class="k">Puntaje general del mes</div><div class="v">${pct(ag.gen)}</div><div class="d">${prev?`Mes anterior: ${pct(prev.gen)} (${ag.gen>=prev.gen?"▲":"▼"} ${pct(Math.abs(ag.gen-prev.gen))})`:"Sin datos del mes anterior"}</div></div>
    <div class="kpi"><div class="k">Recorridas realizadas</div><div class="v">${recs.length}</div><div class="d">${recs.map(r=>fdate(r.fecha).slice(0,5)).join(" · ")}</div></div>
    <div class="kpi"><div class="k">Categoría más baja</div><div class="v" style="font-size:20px;margin-top:8px">${worst!=null?esc(CATS[worst].nombre):"—"}</div><div class="d">${worst!=null?pct(ag.cats[worst]):""}</div></div>

  </div>

  <div class="card"><h2>Resultados por categoría</h2><div class="tbl-wrap"><table class="t"><thead><tr><th>Categoría</th>${recs.map(r=>`<th class="n">${fdate(r.fecha).slice(0,5)}${r.turno?" "+esc(r.turno):""}</th>`).join("")}<th class="n">Total mes</th></tr></thead><tbody>

      rows.push([c.nombre.toUpperCase(),...recs.map(r=>pctX(catScore(r.scores,c.n))),pctX(ag.cats[k])]);});

    const ws=XLSX.utils.aoa_to_sheet(rows); ws["!cols"]=[{wch:48},...recs.map(()=>({wch:12})),{wch:12}];

    XLSX.utils.book_append_sheet(wb,ws2,"Desvíos y destacados");
    saveFile(`Recorrida_${sec}_${m}.xlsx`,new Blob([XLSX.write(wb,{bookType:"xlsx",type:"array"})]));
  };
}
function fmtPct(ws,rows,isPctRow,firstCol=1){
  rows.forEach((r,ri)=>{ if(!isPctRow(r,ri)) return; for(let ci=firstCol;ci<r.length;ci++){const a=XLSX.utils.encode_cell({r:ri,c:ci}); if(ws[a]&&typeof ws[a].v==="number") ws[a].z="0.0%";}});
}

/* ---------- Desvíos / Registro Único de No Conformidades ---------- */
const ESTADOS = ["Abierta","En análisis","En tratamiento","Reabierta","Cerrada"];
const EST_CLS = {"Abierta":"st-open","En análisis":"st-an","En tratamiento":"st-tr","Reabierta":"st-re","Cerrada":"st-ok"};
const METODOS = ["5 Porqués","Diagrama de Ishikawa","Lluvia de ideas","Otro"];
// Clasificación automática de desvíos sin ítem asignado (se puede corregir a mano)
const AUTO = [
  [/al[eé]rgen|etiqueta naranja|sticker naranja/i,"8.a"],
  [/cucarach|mosca|mosquit|insect|plaga|estaci[oó]n( de monitoreo)?|roedor|cebo/i,"7.b"],
  [/port[oó]n|puerta.*abiert|cortina/i,"7.c"],
  [/poes/i,"1.b"],
  [/mantenim|desperfect|roto|rota|rotos|picad|perdida de aceite|no funciona|z[oó]calo|humedad|gotera|charco/i,"5.b"],
  [/arregl|provisori|papel.*arregl/i,"5.c"],
  [/barbijo|cofia|cubre ?barba|epp|guante|protecci[oó]n auditiva|barba/i,"2.b"],
  [/uniforme|ropa/i,"2.a"],
  [/vencid|lote/i,"4.c"],
  [/trazab|vale de consumo|vales/i,"4.b"],
  [/objeto extra|tornillo|ganchito|pala blanca|procedimiento|instructivo/i,"4.a"],
  [/planilla|registro|tachadura|enmienda/i,"6.a"],
  [/utensil|herramient|balde|pala|escoba|esponja|equipo.*suci|trituradora|bomba|balanza/i,"1.c"],
  [/desorden|orden|caja|palet|cart[oó]n|film|strich|pasillo/i,"1.a"],
  [/suci|limpieza|rejilla|regilla|desag|piso|pared|polvo|desecho/i,"1.d"],
  [/capacit|conocimiento|no sab[ií]a/i,"3.a"]
];
function autoItem(t){ const m=/^\s*(\d)\s*\.?\s*([a-d])\b/i.exec(t||""); if(m && ITEM[m[1]+"."+m[2].toLowerCase()]) return m[1]+"."+m[2].toLowerCase(); for(const [re,c] of AUTO) if(re.test(t||"")) return c; return ""; }
function estadoDe(t){
  if(!t||!t.tipo) return "Abierta";
  if(t.tipo==="inmediata") return (t.correccion||"").trim()?"Cerrada":"Abierta";
  if(t.eficacia==="Eficaz") return "Cerrada";
  if(t.eficacia==="No eficaz") return "Reabierta";
  if((t.acciones||[]).some(a=>(a.actividad||"").trim())) return "En tratamiento";
  if((t.causa||"").trim()||(t.analisis||"").trim()) return "En análisis";
  return "Abierta";
}
function allDesvios(){
  const out=[];
  S.recs.forEach(r=>(r.desvios||[]).forEach((d,k)=>{
    const id=d.id||("i"+k), key=r.id+"~"+id, t=S.trat[key]||null;
    const manual=(t&&t.item)||d.item||""; const auto=manual?"":autoItem(d.texto);
    const item=manual||auto, est=estadoDe(t);
    const pend=(t&&t.tipo==="nc")?(t.acciones||[]).filter(a=>a.estado!=="Realizada"&&a.fecha):[];
    const venc=est!=="Cerrada"&&pend.some(a=>a.fecha<today());
    const comp=(t&&t.acciones||[]).map(a=>a.fecha).filter(Boolean).sort().pop()||"";
    out.push({key,recId:r.id,fecha:r.fecha,sector:r.sector,responsableRec:r.responsable,texto:d.texto,item,auto:!!auto,cat:item?ITEM[item].cat:null,t,estado:est,vencida:venc,compromiso:comp});
  }));
  out.sort((a,b)=>(a.fecha+a.key).localeCompare(b.fecha+b.key));
  const cnt={}; out.forEach(d=>{const y=(d.fecha||"").slice(0,4); cnt[y]=(cnt[y]||0)+1; d.nro=`D-${y}-${String(cnt[y]).padStart(3,"0")}`;});
  return out;
}
const catLabel = d=> d.item?`${d.item} ${ITEM[d.item].nombre}`:"Sin clasificar";
const estPill = (e,v)=>`<span class="pill ${EST_CLS[e]}">${e}</span>${v?` <span class="pill st-venc">Vencida</span>`:""}`;

function renderDesvios(app,banner){
  if(S.dEdit) return renderTrat(app,banner);
  const F=S.f.d; const all=allDesvios();
  const list=all.filter(d=>(d.fecha||"").startsWith(F.anio+"")&&(!F.mes||d.fecha.slice(5,7)===F.mes)&&(!F.sector||d.sector===F.sector)&&(!F.cat||String(d.cat)===F.cat)&&
    (!F.estado||(F.estado==="abiertas"?d.estado!=="Cerrada":F.estado==="vencidas"?d.vencida:d.estado===F.estado))&&(!F.q||(d.texto+" "+catLabel(d)).toLowerCase().includes(F.q.toLowerCase())));
  const abiertas=list.filter(d=>d.estado!=="Cerrada").length, cerradas=list.length-abiertas, venc=list.filter(d=>d.vencida).length;
  const sinTrat=list.filter(d=>!d.t||!d.t.tipo).length;
  app.innerHTML=`${banner}<div class="toolbar"><div><h1>Desvíos y no conformidades</h1><div class="muted small">Registro Único de No Conformidades · desvíos detectados en recorridas de planta</div></div>
    <div class="row"><button class="btn" id="d-xls" ${list.length?"":"disabled"}>⬇ Excel (Registro Único)</button><button class="btn primary" id="d-pdf" ${list.length?"":"disabled"}>⬇ PDF</button></div></div>

function renderTrat(app,banner){
  const d=allDesvios().find(x=>x.key===S.dEdit);
  if(!d){ S.dEdit=null; return renderDesvios(app,banner); }
  if(!S.tDraft||S.tDraft._key!==d.key){ S.tDraft=Object.assign({_key:d.key,tipo:"",item:d.t?.item||(d.auto?"":d.item)||"",correccion:"",metodo:"",analisis:"",causa:"",riesgo:"",riesgoId:"",aprobacion:false,aprobadoPor:"",fechaAprobacion:"",acciones:[],eficacia:"Pendiente",fechaVerif:"",verificadoPor:"",obsVerif:"",fechaCierre:""},JSON.parse(JSON.stringify(d.t||{}))); S.tDraft._key=d.key; if(!S.tDraft.item&&d.auto) S.tDraft.item=d.item; }
  const t=S.tDraft, ro=S.canWrite===false||!S.db;

  app.innerHTML=`${banner}<div class="toolbar"><div><button class="btn sm" id="t-back">← Volver al registro</button>

    <div>${estPill(estadoDe(t),d.vencida)}</div></div>
  <div class="card"><h2>1. Registro</h2>
    <div class="banner info" style="margin-bottom:12px"><b>Desvío:</b> ${esc(d.texto)}</div>
    <div class="row"><div class="field" style="flex:2"><label>Ítem / motivo</label><select id="t-item"><option value="">Sin clasificar</option>${ITEMS.map(i=>`<option value="${i.cod}" ${t.item===i.cod?"selected":""}>${i.cod} ${esc(i.nombre)} (${esc(CATS[i.cat-1].nombre)})</option>`).join("")}</select></div>
    <div class="field" style="flex:2"><label>Tratamiento</label><select id="t-tipo"><option value="">— Elegir —</option><option value="inmediata" ${t.tipo==="inmediata"?"selected":""}>Corrección inmediata (se resolvió en el momento)</option><option value="nc" ${t.tipo==="nc"?"selected":""}>No conformidad: requiere análisis y acción correctiva</option></select></div></div>
  </div>
  <div id="t-body"></div>
  <div class="sticky-save"><div class="muted small">Estado resultante: <b id="t-est">${estadoDe(t)}</b></div><div class="row"><button class="btn" id="t-pdf">⬇ Ficha PDF</button><button class="btn primary" id="t-save" ${ro?"disabled":""}>Guardar tratamiento</button></div></div>`;
  const body=()=>{
    const B=$("#t-body");

      <div class="field"><label>Fecha de cierre</label><input type="date" id="t-fc" value="${esc(t.fechaCierre||d.fecha)}"></div></div>
      <div class="legend-note">Si el desvío se repite o la corrección no alcanza, cambiá el tratamiento a “No conformidad”.</div></div>`; }
    else if(t.tipo==="nc"){ B.innerHTML=`
      <div class="card"><h2>2. Análisis de causas</h2><div class="row"><div class="field" style="max-width:260px"><label>Método</label><select id="t-met"><option value="">—</option>${opt(METODOS,t.metodo)}</select></div></div>
        <div class="field" style="margin-top:10px"><label>Desarrollo del análisis</label><textarea id="t-an" style="min-height:110px" placeholder="Ej. 5 Porqués: ¿Por qué…? → ¿Por qué…? …">${esc(t.analisis)}</textarea></div>
        <div class="field" style="margin-top:10px"><label>Causa raíz</label><input type="text" id="t-causa" value="${esc(t.causa)}"></div>
        <div class="row" style="margin-top:10px"><div class="field" style="max-width:300px"><label>¿Requiere modificar la matriz de riesgos/oportunidades?</label><select id="t-rg"><option value="">—</option>${opt(["Sí","No"],t.riesgo)}</select></div>

        <div class="row" style="margin-top:10px"><div class="field" style="max-width:300px"><label>¿Requiere aprobación de Dirección?</label><select id="t-ap"><option value="no" ${!t.aprobacion?"selected":""}>No</option><option value="si" ${t.aprobacion?"selected":""}>Sí</option></select></div>
        <div class="field ${t.aprobacion?"":"hidden"}" id="t-apf1"><label>Aprobado por</label><input type="text" id="t-apby" value="${esc(t.aprobadoPor)}"></div><div class="field ${t.aprobacion?"":"hidden"}" id="t-apf2"><label>Fecha aprobación</label><input type="date" id="t-apd" value="${esc(t.fechaAprobacion)}"></div></div>
      </div>
      <div class="card"><h2>3. Plan de acciones correctivas / preventivas</h2><div id="t-acc"></div><button class="btn sm" id="t-addacc">+ Agregar acción</button></div>

        <div class="field" style="max-width:220px"><label>Eficacia</label><select id="t-ef">${opt(["Pendiente","Eficaz","No eficaz"],t.eficacia)}</select></div>

        <div class="field"><label>Verificado por</label><input type="text" id="t-vby" value="${esc(t.verificadoPor)}"></div>
        <div class="field"><label>Fecha de cierre</label><input type="date" id="t-fc" value="${esc(t.fechaCierre)}"></div></div>
        <div class="field" style="margin-top:10px"><label>Observaciones del seguimiento</label><textarea id="t-ov">${esc(t.obsVerif)}</textarea></div>
        <div class="legend-note">Eficaz → la NC queda cerrada. No eficaz → queda reabierta: revisá el análisis y agregá nuevas acciones (procedimiento, punto 5.4).</div></div>`;
      renderAcc(); }
    else B.innerHTML=`<div class="card muted">Elegí el tipo de tratamiento para continuar.</div>`;
    const bind=(id,k,ev="input")=>{const el=$("#"+id); if(el) el.addEventListener(ev,e=>{t[k]=e.target.value; $("#t-est").textContent=estadoDe(t);});};
    bind("t-corr","correccion"); bind("t-fc","fechaCierre","change"); bind("t-met","metodo","change"); bind("t-an","analisis"); bind("t-causa","causa"); bind("t-rg","riesgo","change"); bind("t-rid","riesgoId");
    bind("t-apby","aprobadoPor"); bind("t-apd","fechaAprobacion","change"); bind("t-ef","eficacia","change"); bind("t-fv","fechaVerif","change"); bind("t-vby","verificadoPor"); bind("t-ov","obsVerif");
    const ap=$("#t-ap"); if(ap) ap.onchange=e=>{t.aprobacion=e.target.value==="si"; $("#t-apf1").classList.toggle("hidden",!t.aprobacion); $("#t-apf2").classList.toggle("hidden",!t.aprobacion);};
    const ef=$("#t-ef"); if(ef) ef.addEventListener("change",e=>{ if(e.target.value==="Eficaz"&&!t.fechaCierre){t.fechaCierre=today(); $("#t-fc").value=t.fechaCierre;} if(e.target.value!=="Eficaz"){t.fechaCierre=""; $("#t-fc").value="";} });
    const aa=$("#t-addacc"); if(aa) aa.onclick=()=>{t.acciones.push({actividad:"",responsable:"",fecha:"",estado:"Pendiente"}); renderAcc(true); $("#t-est").textContent=estadoDe(t);};
  };
  function renderAcc(focus){
    const box=$("#t-acc");
    box.innerHTML=t.acciones.length?t.acciones.map((a,k)=>`<div class="acc-row"><input type="text" data-k="${k}" data-f="actividad" value="${esc(a.actividad)}" placeholder="Actividad a realizar">

      <select data-k="${k}" data-f="estado">${opt(["Pendiente","Realizada"],a.estado)}</select><button class="btn sm danger" data-delacc="${k}">Quitar</button></div>`).join(""):`<p class="muted small" style="margin-top:0">Todavía no hay acciones definidas.</p>`;
    box.oninput=box.onchange=e=>{const el=e.target; if(el.dataset.k!=null){t.acciones[+el.dataset.k][el.dataset.f]=el.value; $("#t-est").textContent=estadoDe(t);}};

  }

  $("#t-item").onchange=e=>t.item=e.target.value;
  $("#t-tipo").onchange=e=>{t.tipo=e.target.value; body(); $("#t-est").textContent=estadoDe(t);};
  $("#t-back").onclick=()=>{S.dEdit=null;S.tDraft=null;render();};
  $("#t-pdf").onclick=()=>pdfFicha({...d,t:clean(t),item:t.item||d.item,auto:false,estado:estadoDe(t)});
  $("#t-save").onclick=async()=>{
    const data=clean(t); data.acciones=(data.acciones||[]).filter(a=>(a.actividad||"").trim());

    if(est==="Cerrada"&&!data.fechaCierre) data.fechaCierre=data.tipo==="inmediata"?d.fecha:today();

  const rows=[head,...list.map(d=>{const t=d.t||{};return [d.nro,fdate(d.fecha),secName(d.sector),"Recorrida de planta",d.item||"",d.cat?CATS[d.cat-1].nombre:"Sin clasificar",d.texto,
    t.tipo==="inmediata"?"Corrección inmediata":t.tipo==="nc"?"No conformidad":"Sin definir",t.correccion||"",t.metodo||"",t.analisis||"",t.causa||"",t.riesgo||"",t.riesgoId||"",t.aprobacion?"Sí":"No",t.aprobadoPor||"",fdate(t.fechaAprobacion),
    (t.acciones||[]).map(a=>`${a.actividad} · ${a.responsable||"s/r"} · ${fdate(a.fecha)||"s/f"} · ${a.estado}`).join("\n"),fdate(d.compromiso),t.tipo==="nc"?(t.eficacia||"Pendiente"):"",fdate(t.fechaVerif),t.verificadoPor||"",t.obsVerif||"",d.estado+(d.vencida?" (vencida)":""),fdate(t.fechaCierre)];})];
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"]=[12,12,30,18,6,24,60,20,40,18,50,40,10,16,10,16,12,70,12,12,12,16,40,16,12].map(w=>({wch:w}));
  ws["!autofilter"]={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:rows.length-1,c:head.length-1}})};
  const sum=[["Resumen"],[],["Sector","Desvíos","Abiertos","Cerrados","Vencidos"],...SECTORES.map(s=>{const l=list.filter(d=>d.sector===s.id);return [s.nombre,l.length,l.filter(d=>d.estado!=="Cerrada").length,l.filter(d=>d.estado==="Cerrada").length,l.filter(d=>d.vencida).length];}),
    [],["Categoría","Desvíos"],...CATS.map(c=>[c.nombre,list.filter(d=>d.cat===c.n).length]),["Sin clasificar",list.filter(d=>!d.cat).length],
    [],["Mes","Desvíos"],...MESES.map((m,i)=>[m,list.filter(d=>+d.fecha.slice(5,7)===i+1).length])];
  const w2=XLSX.utils.aoa_to_sheet(sum); w2["!cols"]=[{wch:42},{wch:10},{wch:10},{wch:10},{wch:10}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Registro Único NC"); XLSX.utils.book_append_sheet(wb,w2,"Resumen");
  saveFile(`Registro_Unico_NC_${S.f.d.anio}${S.f.d.mes?"-"+S.f.d.mes:""}.xlsx`,new Blob([XLSX.write(wb,{bookType:"xlsx",type:"array"})]));
}

function pdfFicha(d){
  if(!d) return; const t=d.t||{};
  const doc=new jspdf.jsPDF({unit:"mm",format:"a4"});
  let y=pdfHeader(doc,"REGISTRO DE NO CONFORMIDAD",`${d.nro} · ${estadoDe(t)}`);
  const L=(k,v)=>[{content:k,styles:{fontStyle:"bold",fillColor:[246,246,243],cellWidth:52}},v||"—"];
  doc.autoTable({...AT,startY:y,body:[L("Fecha de detección",fdate(d.fecha)),L("Sector",secName(d.sector)),L("Origen","Recorrida de planta"+(d.responsableRec?" ("+d.responsableRec+")":"")),L("Ítem / motivo",catLabel(d)),L("Descripción",d.texto),
    L("Tratamiento",t.tipo==="inmediata"?"Corrección inmediata":t.tipo==="nc"?"No conformidad – acción correctiva":"Sin definir")]});
  y=lastY(doc);
  if(t.tipo==="inmediata"){ y=pdfSection(doc,"CORRECCIÓN INMEDIATA",y); doc.autoTable({...AT,startY:y,body:[L("Corrección realizada",t.correccion),L("Fecha de cierre",fdate(t.fechaCierre))]}); }
  if(t.tipo==="nc"){
    y=pdfSection(doc,"ANÁLISIS DE CAUSAS",y);
    doc.autoTable({...AT,startY:y,body:[L("Método",t.metodo),L("Análisis",t.analisis),L("Causa raíz",t.causa),L("¿Modifica matriz R/O?",t.riesgo),L("ID riesgo / oportunidad",t.riesgoId),L("¿Aprobación de Dirección?",t.aprobacion?`Sí – ${t.aprobadoPor||""} ${fdate(t.fechaAprobacion)}`:"No")]}); y=lastY(doc);
    y=pdfSection(doc,"PLAN DE ACCIONES",y);
    doc.autoTable({...AT,startY:y,head:[["Actividad","Responsable","Fecha compromiso","Estado"]],body:(t.acciones||[]).length?t.acciones.map(a=>[a.actividad,a.responsable,fdate(a.fecha),a.estado]):[["Sin acciones definidas","","",""]],columnStyles:{1:{cellWidth:35},2:{cellWidth:30},3:{cellWidth:24}}}); y=lastY(doc);
    y=pdfSection(doc,"SEGUIMIENTO Y VERIFICACIÓN DE EFICACIA",y);
    doc.autoTable({...AT,startY:y,body:[L("Eficacia",t.eficacia||"Pendiente"),L("Fecha verificación",fdate(t.fechaVerif)),L("Verificado por",t.verificadoPor),L("Observaciones",t.obsVerif),L("Fecha de cierre",fdate(t.fechaCierre))]});
  }
  pdfFooter(doc,"Registro Único de No Conformidades"); saveFile(`${d.nro}_${d.sector}.pdf`,doc.output("blob"));
}
